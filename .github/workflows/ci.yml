name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  self-test:
    name: build + fixture self-test (driver + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: rustc-dev, clippy
      - uses: Swatinem/rust-cache@v2
      - name: build driver
        run: cargo build --manifest-path unsafe-scope-lint/Cargo.toml
      - name: unsafe_scope bad fixtures must be denied (each case individually)
        run: |
          set +e
          fail=0
          for f in tests/bad/unsafe_scope/*.rs; do
            ./unsafe-scope-lint/target/debug/unsafe-scope-lint \
              "$f" --crate-type bin --edition 2021 -D unsafe_scope -D non_test_panic_allow >/dev/null 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then echo "FAIL: $f was not caught"; fail=1; fi
          done
          exit $fail
      - name: clippy-owned bad fixtures must pass the driver (owned by classic lints)
        run: |
          set +e
          fail=0
          for f in tests/bad/clippy/*.rs; do
            ./unsafe-scope-lint/target/debug/unsafe-scope-lint \
              "$f" --crate-type bin --edition 2021 -D unsafe_scope -D non_test_panic_allow >/dev/null 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then echo "FAIL: $f is not unsafe_scope's job"; fail=1; fi
          done
          exit $fail
      - name: classic-lint bad fixtures must be denied by clippy list
        run: |
          set +e
          fail=0
          for f in tests/bad/clippy/*.rs; do
            clippy-driver "$f" --crate-type bin --edition 2021 \
              -D clippy::multiple_unsafe_ops_per_block -D unused_unsafe \
              --out-dir target/clippy-fixture-out >/dev/null 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then echo "FAIL: $f was not caught by clippy list"; fail=1; fi
          done
          exit $fail
      - name: good fixtures must pass driver AND clippy list
        run: |
          set +e
          fail=0
          for f in tests/good/*.rs; do
            ./unsafe-scope-lint/target/debug/unsafe-scope-lint \
              "$f" --crate-type bin --edition 2021 -D unsafe_scope -D non_test_panic_allow >/dev/null 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "FAIL: $f produced a false positive in the driver"
              ./unsafe-scope-lint/target/debug/unsafe-scope-lint \
                "$f" --crate-type bin --edition 2021 -D unsafe_scope -D non_test_panic_allow || true
              fail=1
            fi
            clippy-driver "$f" --crate-type bin --edition 2021 \
              -D clippy::multiple_unsafe_ops_per_block -D unused_unsafe \
              --out-dir target/clippy-fixture-out >/dev/null 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "FAIL: $f produced a false positive in clippy list"
              clippy-driver "$f" --crate-type bin --edition 2021 \
                -D clippy::multiple_unsafe_ops_per_block -D unused_unsafe \
                --out-dir target/clippy-fixture-out || true
              fail=1
            fi
          done
          exit $fail
