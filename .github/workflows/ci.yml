name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  self-test:
    name: build + fixture self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: rustc-dev
      - uses: Swatinem/rust-cache@v2
      - name: build driver
        run: cargo build --manifest-path unsafe-scope-lint/Cargo.toml
      - name: bad fixtures must be denied (each case individually)
        run: |
          set +e
          fail=0
          for f in tests/bad/*.rs; do
            LD_LIBRARY_PATH="$(rustc --print sysroot)/lib" \
              ./unsafe-scope-lint/target/debug/unsafe-scope-lint \
              "$f" --crate-type bin --edition 2021 -D unsafe_scope >/dev/null 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then echo "FAIL: $f was not caught"; fail=1; fi
          done
          exit $fail
      - name: good fixtures must pass
        run: |
          set +e
          fail=0
          for f in tests/good/*.rs; do
            LD_LIBRARY_PATH="$(rustc --print sysroot)/lib" \
              ./unsafe-scope-lint/target/debug/unsafe-scope-lint \
              "$f" --crate-type bin --edition 2021 -D unsafe_scope >/dev/null 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "FAIL: $f produced a false positive"
              LD_LIBRARY_PATH="$(rustc --print sysroot)/lib" \
                ./unsafe-scope-lint/target/debug/unsafe-scope-lint \
                "$f" --crate-type bin --edition 2021 -D unsafe_scope || true
              fail=1
            fi
          done
          exit $fail
