name: lint-policy

# Reusable CI for the shared Servyi lint policy. Consumer repos add:
#
#   jobs:
#     lint-policy:
#       uses: servyi/lints/.github/workflows/lint-policy.yml@main
#
# The policy lives HERE, as the explicit clippy flag list below — the
# single source of truth. Repos that also want a local plain
# `cargo clippy` to enforce it can copy the equivalent [workspace.lints]
# table into their manifest (see README), but CI does not depend on
# that. This workflow runs clippy under the explicit flags, the custom
# unsafe_scope rustc-driver lint, and rustdoc link checks. Toolchain is
# the pinned nightly that the driver's rustc_private build requires;
# stable-only projects compile the same on it.

on:
  workflow_call:
    inputs:
      nightly:
        description: "Pinned nightly for the unsafe-scope driver"
        type: string
        default: nightly-2026-09-21

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: clippy (shared policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The shared Servyi lint policy. rust_2018_idioms stays at warn
      # (everything else denies): a warning there is advice, not a
      # failure — that is why it sits after -D warnings.
      - name: clippy
        run: >
          cargo clippy --workspace --all-targets --
          -D warnings
          -W rust_2018_idioms
          -D unused_unsafe
          -D unsafe_op_in_unsafe_fn
          -D unused_results
          -D unused_must_use
          -D non_ascii_idents
          -D clippy::all
          -D clippy::multiple_unsafe_ops_per_block
          -D clippy::undocumented_unsafe_blocks
          -D clippy::unwrap_used
          -D clippy::panic
          -D clippy::missing_panics_doc
          -D clippy::dbg_macro
          -D clippy::todo
          -D clippy::unimplemented

  unsafe-scope:
    name: unsafe_scope (driver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check out the lint collection (pin with a ref for reproducibility)
        uses: actions/checkout@v4
        with:
          repository: servyi/lints
          ref: main
          path: lints
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: rustc-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lints
      - name: build driver
        run: cargo build --manifest-path lints/unsafe-scope-lint/Cargo.toml
      - name: cargo check under -D unsafe_scope -D workspace_lints_table
        run: >
          RUSTC_WRAPPER="$GITHUB_WORKSPACE/lints/unsafe-scope-lint/target/debug/unsafe-scope-lint"
          RUSTFLAGS="-D unsafe_scope -D workspace_lints_table"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/unsafe-scope-check"
          cargo check --workspace --all-targets

  rustdoc:
    name: rustdoc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc with link checking
        run: >
          RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links"
          cargo doc --no-deps
