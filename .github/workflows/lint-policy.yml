name: lint-policy

# Reusable CI for the shared Servyi lint policy. Consumer repos add:
#
#   jobs:
#     lint-policy:
#       uses: servyi/lints/.github/workflows/lint-policy.yml@main
#
# Consumers commit the [workspace.lints] table from servyi-lints.toml
# into their Cargo.toml (see that file's header), so a local
# `cargo clippy` enforces the policy natively. This workflow verifies
# the committed table matches servyi/lints@main, runs clippy under
# the table's own levels, runs the custom unsafe_scope rustc-driver
# lint, and checks rustdoc links. Toolchain is the pinned nightly
# that the driver's rustc_private build requires; stable-only
# projects compile the same on it.

on:
  workflow_call:
    inputs:
      nightly:
        description: "Pinned nightly for the unsafe-scope driver"
        type: string
        default: nightly-2026-09-21

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: clippy (servyi-lints.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check out the lint policy (pin with a ref for reproducibility)
        uses: actions/checkout@v4
        with:
          repository: servyi/lints
          ref: main
          path: lints
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: verify the committed lint table matches servyi-lints.toml
        run: |
          python3 - <<'PY'
          import sys, tomllib
          canonical = tomllib.load(open('lints/servyi-lints.toml', 'rb'))['workspace']['lints']
          manifest = tomllib.load(open('Cargo.toml', 'rb'))
          committed = manifest.get('workspace', {}).get('lints') or manifest.get('lints')
          if committed != canonical:
              print('committed lint table differs from servyi/lints servyi-lints.toml:')
              print('  canonical:', canonical)
              print('  committed:', committed)
              sys.exit(1)
          PY
      - name: clippy (levels come from the committed lint table)
        run: cargo clippy --workspace --all-targets

  unsafe-scope:
    name: unsafe_scope (driver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check out the lint collection (pin with a ref for reproducibility)
        uses: actions/checkout@v4
        with:
          repository: servyi/lints
          ref: main
          path: lints
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: rustc-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lints
      - name: build driver
        run: cargo build --manifest-path lints/unsafe-scope-lint/Cargo.toml
      - name: cargo check under -D unsafe_scope
        run: >
          RUSTC_WRAPPER="$GITHUB_WORKSPACE/lints/unsafe-scope-lint/target/debug/unsafe-scope-lint"
          RUSTFLAGS="-D unsafe_scope"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/unsafe-scope-check"
          cargo check --workspace --all-targets

  rustdoc:
    name: rustdoc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc with link checking
        run: >
          RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links"
          cargo doc --no-deps
