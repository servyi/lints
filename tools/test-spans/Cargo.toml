[package]
name = "test-spans"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone on purpose: the negative-control gate builds this tool on
# the CI runner's preinstalled cargo, independent of this repo's
# pinned nightly toolchain (rustc-dev) that the lint crates need.
[workspace]

[dependencies]
ra_ap_syntax = "0.0.362"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
